<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formularz Express</title>
</head>
<body>
	<h1>Prosty formularz HTML</h1>

	<form action="/form" method="POST">
		<label for="name">Imię:</label>
		<input type="text" id="name" name="name" required>

		<br><br>

		<label for="message">Wiadomość:</label>
		<textarea id="message" name="message" required></textarea>

		<br><br>

		<button type="submit">Wyślij</button>
	</form>

	<p>
		<a href="/router">Sprawdź trasę routera</a>
	</p>

	<form action="/router/form" method="POST">
		<label for="router-name">Imię:</label>
		<input type="text" id="router-name" name="name" required>

		<br><br>

		<label for="email">E-mail:</label>
		<input type="email" id="email" name="email" required>

		<br><br>

		<button type="submit">Wyślij przez router</button>
	</form>
</body>
</html>
